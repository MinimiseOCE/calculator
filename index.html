<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="content">
        <div class="header">
        <h1>Calculator</h1>
    </div>
    <div class="calculator">
        <div class="display">
            <p id="inActive">0</p>
            <p id="active">0</p>
        </div>
        <div class="buttons">
            <div class="row">
                <button class="numButton" id="num7">7</button>
                <button class="numButton" id="num8">8</button>
                <button class="numButton" id="num9">9</button>
                <button class="opButton" id="num">÷</button>
            </div>
            <div class="row">
                <button class="numButton" id="num4">4</button>
                <button class="numButton" id="num5">5</button>
                <button class="numButton" id="num6">6</button>
                <button class="opButton" id="num">×</button>
            </div>
            <div class="row">
                <button class="numButton" id="num1">1</button>
                <button class="numButton" id="num2">2</button>
                <button class="numButton" id="num3">3</button>
                <button class="opButton" id="num">-</button>
            </div>
            <div class="row">
                <button class="numButton">0</button>
                <button class="decimalButton">.</button>
                <button class="equalButton">=</button>
                <button class="opButton">+</button>
            </div>
        </div>
    </div>
    </div>
    <div class="footer">
        Made by Jackson White
    </div>

    
</body>
</html>
